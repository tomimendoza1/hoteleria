<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotelería · Operaciones</title><link rel="stylesheet" href="/styles.css"></head><body><main>
<section id="login" class="card login"><h1>Gestión hotelera</h1><p>Ingresá para operar el hotel.</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Contraseña" required><button>Ingresar</button><p id="loginError" class="error"></p></form></section>
<section id="panel" hidden><header><div><h1>Hotelería</h1><small id="userInfo"></small></div><button id="logout" class="secondary">Salir</button></header><nav><button data-view="dashboard">Inicio</button><button data-view="reservations">Reservas</button><button data-view="calendar">Calendario</button><button data-view="guests">Clientes</button><button data-view="rooms">Habitaciones</button><button data-view="cash">Caja</button><button data-view="stock">Stock</button><button data-view="stats">Estadísticas</button><button data-view="export">Respaldo</button></nav><p id="flash"></p>
<section id="dashboard" class="view"><div id="dashCards" class="cards"></div><div class="grid"><div class="card"><h2>Operación de hoy</h2><div id="todayList"></div></div><div class="card"><h2>Pagos pendientes</h2><div id="pendingList"></div></div></div></section>
<section id="reservations" class="view" hidden><div class="sectionHead"><h2>Reservas</h2><button id="newReservation">Nueva reserva</button></div><div class="filters"><select id="reservationFilter"><option value="">Todos los estados</option><option value="pending">Pendiente</option><option value="confirmed">Confirmada</option><option value="checked_in">Alojado</option><option value="checked_out">Finalizada</option><option value="cancelled">Cancelada</option></select></div><div id="reservationList"></div></section>
<section id="calendar" class="view" hidden><div class="sectionHead"><h2>Calendario semanal</h2><div><button id="prevWeek" class="secondary">‹</button><button id="todayWeek">Hoy</button><button id="nextWeek" class="secondary">›</button></div></div><div id="calendarGrid" class="calendar"></div></section>
<section id="guests" class="view" hidden><div class="sectionHead"><h2>Clientes</h2><input id="guestSearch" placeholder="Buscar nombre, documento o teléfono"></div><div id="guestList"></div></section>
<section id="rooms" class="view" hidden><div class="sectionHead"><h2>Habitaciones</h2><button id="newRoom">Agregar habitación</button></div><div id="roomList"></div></section>
<section id="cash" class="view" hidden><div class="sectionHead"><h2>Caja diaria</h2><input id="cashDate" type="date"></div><div class="grid"><input id="cashOpening" type="number" min="0" placeholder="Saldo inicial"><button id="closeCash">Cerrar caja</button></div><form id="cashForm" class="card form"><select id="cashKind"><option value="income">Ingreso</option><option value="expense">Egreso</option><option value="withdrawal">Retiro</option><option value="adjustment">Ajuste</option></select><input id="cashAmount" type="number" min="0.01" step="0.01" placeholder="Monto" required><select id="cashMethod"><option value="cash">Efectivo</option><option value="transfer">Transferencia</option><option value="debit">Débito</option><option value="credit">Crédito</option><option value="booking">Booking</option><option value="other">Otro</option></select><input id="cashDescription" placeholder="Motivo / descripción" required><button>Registrar movimiento</button></form><div id="cashSummary"></div><div id="cashHistory"></div></section>
<section id="stock" class="view" hidden><div class="sectionHead"><h2>Stock</h2><button id="newProduct">Nuevo producto</button></div><div id="productList"></div></section>
<section id="stats" class="view" hidden><div class="sectionHead"><h2>Estadísticas</h2><input id="statsYear" type="number" min="2020" max="2100"></div><div id="statsSummary" class="cards"></div><div id="statsTable"></div></section>
<section id="export" class="view" hidden><h2>Respaldo</h2><button id="downloadExport">Descargar respaldo completo</button></section></section>
<dialog id="reservationDialog"><form id="reservationForm"><h2 id="reservationTitle">Nueva reserva</h2><input type="hidden" id="reservationId"><div class="grid"><input id="guestName" placeholder="Nombre y apellido" required><input id="guestDocument" placeholder="Documento"></div><div class="grid"><input id="guestPhone" placeholder="Teléfono"><input id="guestAddress" placeholder="Dirección"></div><div class="grid"><select id="roomId" required></select><select id="source"><option value="direct">Directo</option><option value="booking">Booking</option><option value="other">Otro</option></select></div><div class="grid"><input id="checkin" type="date" required><input id="checkout" type="date" required></div><div class="grid"><input id="adults" type="number" min="1" value="1" required><input id="children" type="number" min="0" value="0"></div><div class="grid"><input id="pricePerNight" type="number" min="0" placeholder="Precio por noche" required><input id="deposit" type="number" min="0" value="0" placeholder="Seña"></div><div class="grid"><select id="status"><option value="pending">Pendiente</option><option value="confirmed">Confirmada</option><option value="checked_in">Check-in</option></select><select id="paymentMethod"><option value="cash">Efectivo</option><option value="transfer">Transferencia</option><option value="debit">Débito</option><option value="credit">Crédito</option><option value="booking">Booking</option><option value="other">Otro</option></select></div><label><input id="invoice" type="checkbox"> Necesita factura</label><textarea id="notes" placeholder="Notas"></textarea><p id="reservationError" class="error"></p><button>Guardar reserva</button><button type="button" class="secondary" id="cancelReservation">Cancelar</button></form></dialog>
<dialog id="roomDialog"><form id="roomForm"><h2>Nueva habitación</h2><input id="roomNumber" placeholder="Número" required><input id="roomFloor" placeholder="Piso"><input id="roomType" placeholder="Tipo" value="standard"><input id="roomCapacity" type="number" min="1" value="2" required><input id="roomPrice" type="number" min="0" placeholder="Precio base" required><select id="roomStatus"><option value="available">Disponible</option><option value="maintenance">Mantenimiento</option><option value="out_of_service">Fuera de servicio</option></select><button>Guardar</button><button type="button" class="secondary" id="cancelRoom">Cancelar</button></form></dialog>
<dialog id="productDialog"><form id="productForm"><h2>Nuevo producto</h2><input id="productName" placeholder="Producto" required><input id="productCategory" placeholder="Categoría"><input id="productUnit" value="unidad" placeholder="Unidad"><input id="productMinimum" type="number" min="0" value="0" placeholder="Stock mínimo"><input id="productCost" type="number" min="0" value="0" placeholder="Costo"><input id="productSupplier" placeholder="Proveedor"><button>Guardar</button><button type="button" class="secondary" id="cancelProduct">Cancelar</button></form></dialog><script src="/app.js" defer></script></main></body></html>
